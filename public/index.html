<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1B2360">
  <title>CRC Field Intel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Rep Code Gate -->
  <div id="gate" class="gate">
    <div class="gate-card">
      <div class="gate-logo">CRC</div>
      <h2>Field Intel</h2>
      <p>Enter your rep code</p>
      <input type="text" id="gate-code" maxlength="12" placeholder="REP CODE" autocapitalize="characters" autofocus>
      <button onclick="submitRepCode()">Continue</button>
      <div id="gate-error" class="gate-error"></div>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" style="display:none">
    <div id="app-header" class="app-header">
      <span class="app-title">CRC Field Intel</span>
      <span id="rep-badge" class="rep-badge"></span>
    </div>

    <!-- LEADS VIEW -->
    <div id="view-leads" class="app-view active">
      <div class="quick-add">
        <input type="text" id="lead-address" placeholder="Enter property address..." class="input-lg" autocomplete="off">
        <div id="address-suggestions" class="suggestions"></div>
        <div id="street-view-preview" class="sv-preview"></div>
        <div class="form-row">
          <input type="text" id="lead-name" placeholder="Homeowner name" class="input-md">
          <input type="tel" id="lead-phone" placeholder="Phone" class="input-md">
        </div>
        <div class="chip-row" id="job-type-chips">
          <button class="chip active" data-val="Roof">Roof</button>
          <button class="chip" data-val="Siding">Siding</button>
          <button class="chip" data-val="Full Ext">Full Ext</button>
          <button class="chip" data-val="Gutters">Gutters</button>
          <button class="chip" data-val="Retail">Retail</button>
        </div>
        <div class="chip-row" id="source-chips">
          <button class="chip active" data-val="Door Knock">Door Knock</button>
          <button class="chip" data-val="Referral">Referral</button>
          <button class="chip" data-val="Storm">Storm</button>
          <button class="chip" data-val="Repeat">Repeat</button>
        </div>
        <textarea id="lead-notes" placeholder="Notes (optional)" rows="2" class="input-md"></textarea>
        <button id="btn-add-lead" class="btn-add" onclick="addLead()">ADD LEAD</button>
      </div>
      <div id="lead-confirm" class="lead-confirm" style="display:none"></div>
      <h3 class="section-title">Recent Leads</h3>
      <div id="leads-list"></div>
    </div>

    <!-- MAP VIEW -->
    <div id="view-map" class="app-view">
      <div class="map-controls">
        <button class="map-btn" onclick="centerOnMe()">My Location</button>
        <button class="map-btn" id="btn-knock-mode" onclick="toggleKnockMode()">Door Knock Mode</button>
      </div>
      <div id="map-container" class="map-container">
        <div class="map-placeholder">Map loads when you switch to this tab</div>
      </div>
    </div>

    <!-- STORMS VIEW -->
    <div id="view-storms" class="app-view">
      <div class="storm-header">
        <h3>Storm Activity -- Central Ohio</h3>
        <div class="chip-row" id="storm-filter">
          <button class="chip active" data-val="all">All</button>
          <button class="chip" data-val="30">30 Days</button>
          <button class="chip" data-val="90">90 Days</button>
          <button class="chip" data-val="1.0">1"+</button>
          <button class="chip" data-val="1.5">1.5"+</button>
        </div>
      </div>
      <div id="storm-alert" class="storm-alert" style="display:none"></div>
      <div id="storm-map" class="map-container" style="height:300px">
        <div class="map-placeholder">Storm map loads here</div>
      </div>
      <div class="zone-controls" style="display:none">
        <button class="btn-zone" disabled>Select Zone -- Coming Soon: Direct Mail List</button>
      </div>
      <h3 class="section-title">Hail Events</h3>
      <div id="storm-list"></div>
    </div>

    <!-- ADMIN VIEW (admins only) -->
    <div id="view-admin" class="app-view">
      <h3 class="section-title" style="color:var(--navy)">Admin Dashboard</h3>
      <div id="admin-stats" class="admin-stats"></div>
      <h3 class="section-title">Rep Performance</h3>
      <div id="admin-reps"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px">
        <h3 class="section-title" style="padding:0">Rep Codes</h3>
        <button class="chip active" onclick="document.getElementById('add-rep-form').style.display=''">+ Add Rep Code</button>
      </div>
      <div id="admin-rep-codes"></div>
      <h3 class="section-title">Recent Leads (All Reps)</h3>
      <div id="admin-leads"></div>
      <div style="padding:16px">
        <button class="btn-add" onclick="window.open('/api/admin/export?repCode='+repCode,'_blank')" style="background:var(--navy)">Export All Contacts CSV</button>
      </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <button class="nav-item active" onclick="switchView('leads')" id="nav-leads">
        <span class="nav-icon">&#127968;</span><span class="nav-label">Leads</span>
      </button>
      <button class="nav-item" onclick="switchView('map')" id="nav-map">
        <span class="nav-icon">&#128205;</span><span class="nav-label">Map</span>
      </button>
      <button class="nav-item" onclick="switchView('storms')" id="nav-storms">
        <span class="nav-icon">&#9928;</span><span class="nav-label">Storms</span>
      </button>
      <button class="nav-item" onclick="switchView('admin')" id="nav-admin" style="display:none">
        <span class="nav-icon">&#128100;</span><span class="nav-label">Admin</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRC University — Training Portal</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy: #1B2360;
  --teal: #00B5CC;
  --light-gray: #F5F5F5;
  --dark-gray: #333;
  --green: #27AE60;
  --orange: #F39C12;
  --red: #E74C3C;
  --white: #fff;
}
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--light-gray);
  color: var(--dark-gray);
  min-height: 100vh;
}

/* LOGIN OVERLAY */
.login-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: var(--navy);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 24px;
}
.login-overlay h1 { color: var(--white); font-size: 28px; }
.login-overlay .subtitle { color: var(--teal); font-size: 14px; letter-spacing: 2px; text-transform: uppercase; }
.login-overlay input {
  padding: 14px 20px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.1); color: var(--white); font-size: 18px;
  text-align: center; width: 220px; outline: none; text-transform: uppercase;
}
.login-overlay input::placeholder { color: rgba(255,255,255,0.4); }
.login-overlay input:focus { border-color: var(--teal); }
.login-overlay button {
  padding: 12px 40px; border-radius: 8px; border: none;
  background: var(--teal); color: var(--white); font-size: 16px; font-weight: 600;
  cursor: pointer;
}
.login-overlay .error { color: var(--red); font-size: 14px; min-height: 20px; }

/* TOP BAR */
.topbar {
  background: var(--navy); color: var(--white); padding: 16px 20px;
  position: sticky; top: 0; z-index: 100;
}
.topbar-inner {
  max-width: 1200px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
}
.topbar-brand { display: flex; align-items: center; gap: 12px; }
.topbar-brand .logo {
  width: 40px; height: 40px; background: var(--teal); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 16px; color: var(--white);
}
.topbar-brand h1 { font-size: 20px; font-weight: 700; }
.topbar-brand .tag { font-size: 11px; color: var(--teal); letter-spacing: 1.5px; text-transform: uppercase; }
.topbar-right { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.topbar-right select {
  padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.1); color: var(--white); font-size: 14px;
}
.topbar-right select option { background: var(--navy); color: var(--white); }

/* PROGRESS BAR */
.progress-bar-wrap {
  background: rgba(255,255,255,0.15); border-radius: 10px; height: 20px;
  width: 200px; overflow: hidden; position: relative;
}
.progress-bar-fill {
  height: 100%; background: var(--teal); border-radius: 10px;
  transition: width 0.4s ease;
}
.progress-bar-text {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; color: var(--white);
}

/* CONTAINER */
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }

/* MODULE GRID */
.module-grid {
  display: grid; gap: 20px;
  grid-template-columns: 1fr;
}
@media(min-width:640px) { .module-grid { grid-template-columns: 1fr 1fr; } }
@media(min-width:960px) { .module-grid { grid-template-columns: 1fr 1fr 1fr; } }

/* MODULE CARD */
.module-card {
  background: var(--white); border-radius: 12px; overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: box-shadow 0.2s;
}
.module-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
.module-card-header {
  padding: 16px 18px; cursor: pointer; display: flex; align-items: flex-start; gap: 14px;
}
.module-badge {
  width: 40px; height: 40px; min-width: 40px; border-radius: 50%; background: var(--teal);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 15px; color: var(--white);
}
.module-info { flex: 1; }
.module-info h3 { font-size: 16px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
.module-info p { font-size: 13px; color: #666; line-height: 1.4; }
.module-status {
  font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 12px;
  white-space: nowrap; margin-top: 2px;
}
.status-not-started { background: #eee; color: #999; }
.status-in-progress { background: #FFF3CD; color: #856404; }
.status-complete { background: #D4EDDA; color: #155724; }
.module-chevron { font-size: 18px; color: #999; transition: transform 0.2s; margin-top: 4px; }
.module-card.expanded .module-chevron { transform: rotate(180deg); }

/* MODULE BODY (expandable) */
.module-body { display: none; padding: 0 18px 18px; }
.module-card.expanded .module-body { display: block; }
.resource-section { margin-bottom: 14px; }
.resource-section-title {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px;
  color: var(--teal); margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #eee;
}
.resource-item {
  display: flex; align-items: flex-start; gap: 10px; padding: 6px 0;
  font-size: 14px;
}
.native-player {
  flex: 1; display: flex; flex-direction: column;
}
.native-player .resource-label {
  font-size: 14px; color: var(--navy); font-weight: 600;
}
.native-player audio, .native-player video {
  border-radius: 8px; background: var(--light-gray);
}
.resource-item input[type="checkbox"] {
  width: 18px; height: 18px; accent-color: var(--teal); cursor: pointer; flex-shrink: 0;
}
.resource-item a { color: var(--navy); text-decoration: none; font-weight: 500; }
.resource-item a:hover { color: var(--teal); }
.resource-item .pending { color: #bbb; font-style: italic; font-weight: 400; }
.resource-item .quiz-score { font-size: 12px; color: var(--teal); font-weight: 600; margin-left: 8px; }
.week-label { font-size: 12px; color: #999; margin-top: 2px; }

/* ONBOARDING TRACKER */
.section-title {
  font-size: 22px; font-weight: 700; color: var(--navy); margin: 32px 0 16px;
}
.onboarding-tracker {
  background: var(--white); border-radius: 12px; padding: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.week-header {
  font-size: 14px; font-weight: 700; color: var(--navy); margin: 16px 0 8px;
  text-transform: uppercase; letter-spacing: 1px;
}
.week-header:first-child { margin-top: 0; }
.timeline {
  display: flex; gap: 8px; flex-wrap: wrap;
}
.day-card {
  flex: 1; min-width: 80px; max-width: 120px; padding: 12px 8px;
  border-radius: 8px; text-align: center; border: 2px solid transparent;
}
.day-card.completed { background: #D4EDDA; border-color: var(--green); }
.day-card.current { background: #E0F7FA; border-color: var(--teal); }
.day-card.future { background: #eee; border-color: #ddd; }
.day-card .day-num { font-weight: 700; font-size: 16px; color: var(--navy); }
.day-card .day-label { font-size: 10px; color: #666; margin-top: 4px; line-height: 1.3; }
.day-card.completed .day-num { color: var(--green); }
.day-card.current .day-num { color: var(--teal); }

/* ADMIN */
.admin-section {
  margin-top: 32px; background: var(--white); border-radius: 12px;
  padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.admin-section h2 { color: var(--navy); margin-bottom: 16px; font-size: 20px; }
.admin-table {
  width: 100%; border-collapse: collapse; font-size: 13px; overflow-x: auto; display: block;
}
.admin-table th, .admin-table td {
  padding: 8px 10px; text-align: left; border-bottom: 1px solid #eee; white-space: nowrap;
}
.admin-table th { background: var(--navy); color: var(--white); font-weight: 600; position: sticky; top: 0; }
.admin-filter { margin-bottom: 12px; }
.admin-filter input {
  padding: 8px 14px; border-radius: 6px; border: 1px solid #ddd; font-size: 14px; width: 200px;
}
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }
.dot-green { background: var(--green); }
.dot-yellow { background: var(--orange); }
.dot-gray { background: #ccc; }

/* MOBILE */
@media(max-width:639px) {
  .topbar-inner { flex-direction: column; align-items: flex-start; }
  .progress-bar-wrap { width: 100%; }
  .day-card { min-width: 60px; }
}

.hidden { display: none !important; }

/* ============================================================
   QUIZ MODAL
   ============================================================ */
.quiz-overlay, .fc-overlay {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,0.88);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.quiz-box {
  background: var(--white); border-radius: 16px; width: 100%; max-width: 580px;
  padding: 28px; position: relative; max-height: 92vh; overflow-y: auto;
}
.quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.quiz-progress-label { font-size: 13px; color: #999; font-weight: 600; }
.quiz-close { background: none; border: none; font-size: 22px; color: #bbb; cursor: pointer; line-height: 1; padding: 0; }
.quiz-close:hover { color: var(--dark-gray); }
.quiz-pbar { height: 6px; background: #eee; border-radius: 3px; margin-bottom: 22px; }
.quiz-pbar-fill { height: 100%; background: var(--teal); border-radius: 3px; transition: width 0.35s ease; }
.quiz-question { font-size: 18px; font-weight: 700; color: var(--navy); margin-bottom: 20px; line-height: 1.45; }
.quiz-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.quiz-opt {
  padding: 13px 16px; border-radius: 10px; border: 2px solid #ddd;
  background: var(--white); font-size: 14px; text-align: left;
  cursor: pointer; transition: all 0.15s; font-family: inherit;
  color: var(--dark-gray); line-height: 1.4;
}
.quiz-opt:hover:not(:disabled) { border-color: var(--teal); background: #f0fafb; }
.quiz-opt.correct { border-color: var(--green) !important; background: #d4edda; color: #155724; font-weight: 600; }
.quiz-opt.wrong { border-color: var(--red) !important; background: #f8d7da; color: #721c24; }
.quiz-opt:disabled { cursor: default; }
.quiz-explanation {
  font-size: 13px; color: #555; background: #f7f7f7; border-left: 3px solid var(--teal);
  border-radius: 0 8px 8px 0; padding: 12px 14px; margin-bottom: 16px; line-height: 1.55;
}
.quiz-next-btn {
  width: 100%; padding: 14px; background: var(--teal); color: var(--white);
  border: none; border-radius: 10px; font-size: 16px; font-weight: 600;
  cursor: pointer; font-family: inherit;
}
.quiz-next-btn:hover { opacity: 0.88; }
.quiz-score-screen { text-align: center; padding: 8px 0; }
.quiz-score-big { font-size: 72px; font-weight: 800; color: var(--navy); line-height: 1; }
.quiz-score-label { font-size: 15px; color: #777; margin: 8px 0 16px; }
.quiz-pass-badge {
  display: inline-block; padding: 6px 22px; border-radius: 20px;
  font-weight: 700; font-size: 15px; margin-bottom: 24px;
}
.quiz-pass-badge.pass { background: #d4edda; color: #155724; }
.quiz-pass-badge.fail { background: #f8d7da; color: #721c24; }
.quiz-score-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.quiz-score-btns button {
  padding: 12px 28px; border-radius: 10px; font-size: 15px; font-weight: 600;
  cursor: pointer; font-family: inherit; border: none;
}
.quiz-score-btns .btn-primary { background: var(--teal); color: var(--white); }
.quiz-score-btns .btn-secondary { background: #eee; color: var(--dark-gray); }

/* ============================================================
   FLASHCARD MODAL
   ============================================================ */
.fc-box {
  background: var(--white); border-radius: 16px; width: 100%; max-width: 540px;
  padding: 28px; position: relative;
}
.fc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.fc-progress-label { font-size: 13px; color: #999; font-weight: 600; }
.fc-close { background: none; border: none; font-size: 22px; color: #bbb; cursor: pointer; line-height: 1; padding: 0; }
.fc-close:hover { color: var(--dark-gray); }
.fc-pbar { height: 6px; background: #eee; border-radius: 3px; margin-bottom: 18px; }
.fc-pbar-fill { height: 100%; background: var(--teal); border-radius: 3px; transition: width 0.35s ease; }
.fc-module-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--teal); font-weight: 700; margin-bottom: 16px; }
.fc-card-wrap { perspective: 1000px; height: 200px; cursor: pointer; margin-bottom: 14px; user-select: none; }
.fc-card {
  width: 100%; height: 100%; position: relative;
  transform-style: preserve-3d; transition: transform 0.45s ease;
}
.fc-card.flipped { transform: rotateY(180deg); }
.fc-face {
  position: absolute; inset: 0; backface-visibility: hidden;
  border-radius: 12px; display: flex; align-items: center; justify-content: center;
  padding: 24px; text-align: center; font-size: 16px; font-weight: 600; line-height: 1.45;
}
.fc-front { background: var(--navy); color: var(--white); }
.fc-back { background: var(--teal); color: var(--white); transform: rotateY(180deg); font-weight: 400; font-size: 15px; }
.fc-tap-hint { text-align: center; font-size: 12px; color: #bbb; margin-bottom: 18px; }
.fc-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.fc-nav-btn {
  padding: 10px 18px; border-radius: 8px; border: 1px solid #ddd;
  background: var(--white); font-size: 14px; cursor: pointer; font-family: inherit; color: var(--dark-gray);
}
.fc-nav-btn:hover:not(:disabled) { background: #f5f5f5; }
.fc-nav-btn:disabled { opacity: 0.3; cursor: default; }
.fc-done-btn {
  flex: 1; padding: 12px; background: var(--teal); color: var(--white);
  border: none; border-radius: 10px; font-size: 15px; font-weight: 600;
  cursor: pointer; font-family: inherit;
}
.fc-done-btn:hover { opacity: 0.88; }

/* ============================================================
   QUIZ / FLASHCARD LAUNCH BUTTONS (in module cards)
   ============================================================ */
.quiz-launch-btn, .fc-launch-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: 8px; border: none;
  font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
}
.quiz-launch-btn { background: var(--navy); color: var(--white); }
.quiz-launch-btn:hover { opacity: 0.85; }
.fc-launch-btn { background: var(--teal); color: var(--white); }
.fc-launch-btn:hover { opacity: 0.85; }
</style>
</head>

<!-- LOGIN OVERLAY -->
<div class="login-overlay" id="loginOverlay">

    </div>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="container" id="mainContent" style="display:none;">

</div>

/* ============================================================
   AUTH
   ============================================================ */
function doLogin() {
  const code = document.getElementById('loginInput').value.trim().toUpperCase();
  if (!code) return;
  fetch('/api/rep-codes')
    .then(r => r.json())
    .then(reps => {
      const rep = reps.find(r => r.code === code && r.active !== false);
      if (!rep) {
        document.getElementById('loginError').textContent = 'Invalid rep code';
        return;
      }
      currentRepCode = code;
      currentRepName = rep.name;
      isAdminUser = (rep.role === 'admin');
      repList = reps.filter(r => r.active !== false);
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('topbar').style.display = '';
      document.getElementById('mainContent').style.display = '';
      if (isAdminUser) {
        document.getElementById('repSelector').style.display = '';
        buildRepSelector();
        document.getElementById('adminSection').classList.remove('hidden');
      }
      loadProgress();
    })
    .catch(() => {
      document.getElementById('loginError').textContent = 'Connection error';
    });
}

function logout() {
  currentRepCode = '';
  progress = {};
  document.getElementById('loginOverlay').style.display = '';
  document.getElementById('topbar').style.display = 'none';
  document.getElementById('mainContent').style.display = 'none';
  document.getElementById('loginInput').value = '';
  document.getElementById('loginError').textContent = '';
}

// Auto-login from query param
(function() {
  const params = new URLSearchParams(window.location.search);
  const auth = params.get('auth');
  if (auth) {
    document.getElementById('loginInput').value = auth;
    setTimeout(doLogin, 100);
  }
  document.getElementById('loginInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
})();

function buildRepSelector() {
  const sel = document.getElementById('repSelector');
  sel.innerHTML = repList.map(r =>
    `<option value="${r.code}" ${r.code === currentRepCode ? 'selected' : ''}>${r.name} (${r.code})</option>`
  ).join('');
}

function switchRep(code) {
  currentRepCode = code;
  const rep = repList.find(r => r.code === code);
  if (rep) currentRepName = rep.name;
  loadProgress();
}

/* ============================================================
   DATA LOADING
   ============================================================ */
function loadProgress() {
  // Load Cloudinary assets manifest + rep progress in parallel
  Promise.all([
    fetch('/api/training/assets').then(r => r.json()).catch(() => ({})),
    fetch('/api/training/quizzes').then(r => r.json()).catch(() => ({})),
    fetch('/api/training/flashcards').then(r => r.json()).catch(() => ({})),
    fetch(`/api/training/progress/${currentRepCode}`).then(r => r.json()).catch(() => ({ modules: {}, onboardingDay: 1 }))
  ]).then(([assets, quizzes, flashcards, data]) => {
    cloudinaryAssets = assets;
    quizData = quizzes;
    flashcardData = flashcards;
    progress = data;
    renderAll();
  }).catch(() => {
    progress = { modules: {}, onboardingDay: 1 };
    renderAll();
  });

  if (isAdminUser) {
    fetch(`/api/training/progress?auth=${currentRepCode}`)
      .then(r => r.json())
      .then(data => {
        allProgress = data;
        renderAdminTable();
      })
      .catch(() => {});
  }
}

function saveResource(moduleId, resourceId, completed) {
  fetch(`/api/training/progress/${currentRepCode}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ moduleId, resourceId, completed })
  })
  .then(r => r.json())
  .then(data => {
    progress = data;
    updateOverallProgress();
    updateModuleStatus(moduleId);
  });
}

/* ============================================================
   RENDERING
   ============================================================ */
function renderAll() {
  renderModuleCards();
  updateOverallProgress();
  renderOnboarding();
}

function getModuleStatus(mod) {
  const mp = progress.modules && progress.modules[mod.id];
  if (!mp || !mp.resources) return 'not_started';
  const vals = Object.values(mp.resources);
  if (vals.length === 0) return 'not_started';
  const done = vals.filter(Boolean).length;
  if (done === 0) return 'not_started';
  if (done >= mod.resources.length) return 'complete';
  return 'in_progress';
}

function getStatusLabel(status) {
  if (status === 'complete') return 'Complete';
  if (status === 'in_progress') return 'In Progress';
  return 'Not Started';
}

function updateOverallProgress() {
  let completed = 0;
  MODULES.forEach(mod => {
    if (getModuleStatus(mod) === 'complete') completed++;
  });
  const pct = Math.round((completed / MODULES.length) * 100);
  document.getElementById('overallBar').style.width = pct + '%';
  document.getElementById('overallText').textContent = `${completed} / ${MODULES.length} modules`;
}

function updateModuleStatus(moduleId) {
  const mod = MODULES.find(m => m.id === moduleId);
  if (!mod) return;
  const card = document.querySelector(`[data-module="${moduleId}"]`);
  if (!card) return;
  const status = getModuleStatus(mod);
  const badge = card.querySelector('.module-status');
  badge.className = 'module-status status-' + status.replace('_', '-');
  badge.textContent = getStatusLabel(status);
}

function renderModuleCards() {
  const grid = document.getElementById('moduleGrid');
  grid.innerHTML = MODULES.map(mod => {
    const status = getModuleStatus(mod);
    const mp = (progress.modules && progress.modules[mod.id]) || { resources: {} };
    const modAssets = cloudinaryAssets[mod.id] || {};

    // Group resources by section
    const sections = {};
    mod.resources.forEach(r => {
      if (!sections[r.section]) sections[r.section] = [];
      sections[r.section].push(r);
    });

    let bodyHTML = '';
    for (const sec of ['listen', 'watch', 'study', 'test', 'reports']) {
      if (!sections[sec]) continue;
      bodyHTML += `<div class="resource-section">
        <div class="resource-section-title">${SECTION_ICONS[sec]} ${SECTION_LABELS[sec]}</div>`;
      sections[sec].forEach(r => {
        const checked = mp.resources[r.id] ? 'checked' : '';
        const quizScore = (r.id === 'quiz' && mp.quizScore != null) ? `<span class="quiz-score">${mp.quizScore}%</span>` : '';
        const asset = modAssets[r.id];
        let link;
        // Native quiz engine
        if (r.id === 'quiz' && quizData[mod.id] && quizData[mod.id].questions) {
          const prevScore = mp.quizScore != null ? ' <span class="quiz-score">' + mp.quizScore + '%</span>' : '';
          const btnLabel = mp.quizScore != null ? '&#x1F4DD; Retake Quiz' : '&#x1F4DD; Take Quiz';
          link = '<button class="quiz-launch-btn" onclick="openQuiz(\'' + mod.id + '\')">' + btnLabel + '</button>' + prevScore;
        // Native flashcard engine
        } else if (r.id === 'flashcards' && flashcardData[mod.id] && flashcardData[mod.id].cards) {
          link = '<button class="fc-launch-btn" onclick="openFlashcards(\'' + mod.id + '\')">&#x1F0CF; Study Flashcards</button>';
        } else if (asset && asset.mediaType === 'audio') {
          link = `<div class="native-player">
            <span class="resource-label">${r.label}</span>
            <audio controls preload="none" style="width:100%;margin-top:6px;border-radius:8px">
              <source src="${asset.url}" type="audio/mp4">
            </audio>
          </div>`;
        } else if (asset && asset.mediaType === 'video') {
          link = `<div class="native-player">
            <span class="resource-label">${r.label}</span>
            <video controls preload="none" style="width:100%;margin-top:6px;border-radius:8px;max-height:300px">
              <source src="${asset.url}" type="video/mp4">
            </video>
          </div>`;
        } else if (asset && (asset.mediaType === 'pdf' || asset.mediaType === 'image')) {
          link = `<a href="${asset.url}" target="_blank">${r.label}</a>`;
        } else if (r.url) {
          link = `<a href="${r.url}" target="_blank">${r.label}</a>`;
        } else {
          link = `<span class="pending">${r.label} -- Link pending</span>`;
        }
        bodyHTML += `<div class="resource-item">
          <input type="checkbox" ${checked} onchange="saveResource('${mod.id}','${r.id}',this.checked)">
          ${link}${quizScore}
        </div>`;
      });
      bodyHTML += '</div>';
    }

    return `<div class="module-card" data-module="${mod.id}">
      <div class="module-card-header" onclick="toggleModule(this)">
        <div class="module-badge">${mod.number}</div>
        <div class="module-info">
          <h3>${mod.title}</h3>
          <p>${mod.description}</p>
          <div class="week-label">Week ${mod.week} · Day ${mod.day}</div>
        </div>
        <span class="module-status status-${status.replace('_','-')}">${getStatusLabel(status)}</span>
        <span class="module-chevron">▼</span>
      </div>
      <div class="module-body">${bodyHTML}</div>
    </div>`;
  }).join('');
}

function toggleModule(header) {
  header.parentElement.classList.toggle('expanded');
}

/* ============================================================
   ONBOARDING TRACKER
   ============================================================ */
function renderOnboarding() {
  const currentDay = progress.onboardingDay || 1;
  const tracker = document.getElementById('onboardingTracker');

  let html = '';
  let lastWeek = 0;
  ONBOARDING_DAYS.forEach(d => {
    if (d.week !== lastWeek) {
      if (lastWeek !== 0) html += '</div>';
      html += `<div class="week-header">Week ${d.week}</div><div class="timeline">`;
      lastWeek = d.week;
    }
    let cls = 'future';
    if (d.day < currentDay) cls = 'completed';
    else if (d.day === currentDay) cls = 'current';

    const moduleNames = d.modules.map(mid => {
      const m = MODULES.find(mm => mm.id === mid);
      return m ? m.title : '';
    }).filter(Boolean).join(', ');

    html += `<div class="day-card ${cls}">
      <div class="day-num">Day ${d.day}</div>
      <div class="day-label">${d.label}</div>
    </div>`;
  });
  html += '</div>';
  tracker.innerHTML = html;
}

/* ============================================================
   ADMIN TABLE
   ============================================================ */
function renderAdminTable() {
  if (!isAdminUser) return;
  const table = document.getElementById('adminTable');
  const filter = (document.getElementById('adminFilter').value || '').toLowerCase();

  let headerRow = '<tr><th>Rep</th>';
  MODULES.forEach(m => { headerRow += `<th>M${m.number}</th>`; });
  headerRow += '<th>Avg Quiz</th></tr>';

  let bodyRows = '';
  const reps = Object.keys(allProgress).filter(code => {
    if (!filter) return true;
    const rep = repList.find(r => r.code === code);
    const name = rep ? rep.name.toLowerCase() : code.toLowerCase();
    return name.includes(filter) || code.toLowerCase().includes(filter);
  });

  reps.forEach(code => {
    const rp = allProgress[code];
    const rep = repList.find(r => r.code === code);
    const name = rep ? rep.name : code;
    let row = `<tr><td><strong>${name}</strong><br><small>${code}</small></td>`;
    let quizTotal = 0, quizCount = 0;

    MODULES.forEach(mod => {
      const mp = rp.modules && rp.modules[mod.id];
      if (!mp || !mp.resources) {
        row += '<td><span class="dot dot-gray"></span></td>';
      } else {
        const vals = Object.values(mp.resources);
        const done = vals.filter(Boolean).length;
        if (done >= mod.resources.length) {
          row += '<td><span class="dot dot-green"></span></td>';
        } else if (done > 0) {
          row += '<td><span class="dot dot-yellow"></span></td>';
        } else {
          row += '<td><span class="dot dot-gray"></span></td>';
        }
        if (mp.quizScore != null) {
          quizTotal += mp.quizScore;
          quizCount++;
        }
      }
    });

    const avg = quizCount > 0 ? Math.round(quizTotal / quizCount) : '—';
    row += `<td>${avg}${quizCount > 0 ? '%' : ''}</td></tr>`;
    bodyRows += row;
  });

  if (reps.length === 0) {
    bodyRows = `<tr><td colspan="${MODULES.length + 2}" style="text-align:center;padding:20px;color:#999;">No progress data yet</td></tr>`;
  }

  table.innerHTML = headerRow + bodyRows;
}

/* ============================================================
   QUIZ ENGINE
   ============================================================ */
function openQuiz(modId) {
  const qd = quizData[modId];
  if (!qd || !qd.questions || qd.questions.length === 0) return;
  currentQuiz = { modId, questions: qd.questions, current: 0, score: 0, answered: false };
  document.getElementById('quizQScreen').classList.remove('hidden');
  document.getElementById('quizSScreen').classList.add('hidden');
  document.getElementById('quizOverlay').classList.remove('hidden');
  renderQuizQ();
}

function renderQuizQ() {
  const q = currentQuiz.questions[currentQuiz.current];
  const total = currentQuiz.questions.length;
  const idx = currentQuiz.current;
  document.getElementById('quizProgressLabel').textContent = 'Q ' + (idx + 1) + ' of ' + total;
  document.getElementById('quizPbarFill').style.width = ((idx / total) * 100) + '%';
  document.getElementById('quizQText').textContent = q.q;
  document.getElementById('quizExpl').classList.add('hidden');
  document.getElementById('quizNextBtn').classList.add('hidden');
  currentQuiz.answered = false;
  const optContainer = document.getElementById('quizOpts');
  optContainer.innerHTML = q.options.map((opt, i) =>
    '<button class="quiz-opt" onclick="selectAnswer(' + i + ')">' + opt + '</button>'
  ).join('');
}

function selectAnswer(selectedIdx) {
  if (currentQuiz.answered) return;
  currentQuiz.answered = true;
  const q = currentQuiz.questions[currentQuiz.current];
  const opts = document.querySelectorAll('.quiz-opt');
  opts.forEach(function(btn, i) {
    btn.disabled = true;
    if (i === q.correct) btn.classList.add('correct');
    else if (i === selectedIdx) btn.classList.add('wrong');
  });
  if (selectedIdx === q.correct) currentQuiz.score++;
  const expl = document.getElementById('quizExpl');
  expl.textContent = q.explanation;
  expl.classList.remove('hidden');
  const nextBtn = document.getElementById('quizNextBtn');
  const isLast = currentQuiz.current === currentQuiz.questions.length - 1;
  nextBtn.textContent = isLast ? 'See Results' : 'Next \u2192';
  nextBtn.classList.remove('hidden');
}

function nextQuizQ() {
  const isLast = currentQuiz.current === currentQuiz.questions.length - 1;
  if (isLast) {
    showQuizResults();
  } else {
    currentQuiz.current++;
    renderQuizQ();
  }
}

function showQuizResults() {
  const total = currentQuiz.questions.length;
  const score = currentQuiz.score;
  const pct = Math.round((score / total) * 100);
  const passed = pct >= 80;
  document.getElementById('quizQScreen').classList.add('hidden');
  document.getElementById('quizSScreen').classList.remove('hidden');
  document.getElementById('quizProgressLabel').textContent = 'Results';
  document.getElementById('quizPbarFill').style.width = '100%';
  document.getElementById('quizScoreNum').textContent = score + '/' + total;
  const badge = document.getElementById('quizPassBadge');
  badge.textContent = passed ? '\u2713 Passed \u2014 ' + pct + '%' : '\u2717 ' + pct + '% \u2014 Study and Retry';
  badge.className = 'quiz-pass-badge ' + (passed ? 'pass' : 'fail');
  const modId = currentQuiz.modId;
  fetch('/api/training/progress/' + currentRepCode, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ moduleId: modId, quizScore: pct })
  }).then(function(r) { return r.json(); }).then(function(data) {
    progress = data;
    if (passed) {
      fetch('/api/training/progress/' + currentRepCode, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ moduleId: modId, resourceId: 'quiz', completed: true })
      }).then(function(r) { return r.json(); }).then(function(d) {
        progress = d;
        renderModuleCards();
        updateOverallProgress();
      });
    } else {
      updateOverallProgress();
      updateModuleStatus(modId);
    }
  });
}

function retakeQuiz() {
  const qd = quizData[currentQuiz.modId];
  currentQuiz = { modId: currentQuiz.modId, questions: qd.questions, current: 0, score: 0, answered: false };
  document.getElementById('quizQScreen').classList.remove('hidden');
  document.getElementById('quizSScreen').classList.add('hidden');
  renderQuizQ();
}

function closeQuiz() {
  document.getElementById('quizOverlay').classList.add('hidden');
  renderModuleCards();
}

/* ============================================================
   FLASHCARD ENGINE
   ============================================================ */
function openFlashcards(modId) {
  const fd = flashcardData[modId];
  if (!fd || !fd.cards || fd.cards.length === 0) return;
  currentFc = { modId: modId, cards: fd.cards, current: 0, flipped: false };
  document.getElementById('fcModTitle').textContent = fd.title || 'Flashcards';
  document.getElementById('fcOverlay').classList.remove('hidden');
  renderFcCard();
}

function renderFcCard() {
  const card = currentFc.cards[currentFc.current];
  const total = currentFc.cards.length;
  const idx = currentFc.current;
  document.getElementById('fcProgressLabel').textContent = 'Card ' + (idx + 1) + ' of ' + total;
  document.getElementById('fcPbarFill').style.width = (((idx + 1) / total) * 100) + '%';
  document.getElementById('fcFront').textContent = card.front;
  document.getElementById('fcBack').textContent = card.back;
  currentFc.flipped = false;
  document.getElementById('fcCard').classList.remove('flipped');
  document.getElementById('fcPrevBtn').disabled = idx === 0;
  document.getElementById('fcNextBtn').disabled = idx === total - 1;
  if (idx === total - 1) {
    setTimeout(function() {
      fetch('/api/training/progress/' + currentRepCode, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ moduleId: currentFc.modId, resourceId: 'flashcards', completed: true })
      }).then(function(r) { return r.json(); }).then(function(d) { progress = d; });
    }, 800);
  }
}

function flipCard() {
  currentFc.flipped = !currentFc.flipped;
  if (currentFc.flipped) document.getElementById('fcCard').classList.add('flipped');
  else document.getElementById('fcCard').classList.remove('flipped');
}

function nextFcCard() {
  if (currentFc.current < currentFc.cards.length - 1) {
    currentFc.current++;
    renderFcCard();
  }
}

function prevFcCard() {
  if (currentFc.current > 0) {
    currentFc.current--;
    renderFcCard();
  }
}

function closeFlashcards() {
  document.getElementById('fcOverlay').classList.add('hidden');
  renderModuleCards();
}
</script>

<!-- QUIZ MODAL -->
<div class="quiz-overlay hidden" id="quizOverlay">
  <div class="quiz-box">
    <div class="quiz-header">
      <span class="quiz-progress-label" id="quizProgressLabel">Q 1 of 10</span>
      <button class="quiz-close" onclick="closeQuiz()">&#x2715;</button>
    </div>
    <div class="quiz-pbar"><div class="quiz-pbar-fill" id="quizPbarFill" style="width:0%"></div></div>
    <div id="quizQScreen">
      <div class="quiz-question" id="quizQText"></div>
      <div class="quiz-options" id="quizOpts"></div>
      <div class="quiz-explanation hidden" id="quizExpl"></div>
      <button class="quiz-next-btn hidden" id="quizNextBtn" onclick="nextQuizQ()">Next &#x2192;</button>
    </div>
    <div id="quizSScreen" class="quiz-score-screen hidden">
      <div class="quiz-score-big" id="quizScoreNum"></div>
      <div class="quiz-score-label">questions correct</div>
      <div class="quiz-pass-badge" id="quizPassBadge"></div>
      <div class="quiz-score-btns">
        <button class="btn-secondary" onclick="retakeQuiz()">Retake</button>
        <button class="btn-primary" onclick="closeQuiz()">Done</button>
      </div>
    </div>
  </div>
</div>

<!-- FLASHCARD MODAL -->
<div class="fc-overlay hidden" id="fcOverlay">
  <div class="fc-box">
    <div class="fc-header">
      <span class="fc-progress-label" id="fcProgressLabel">Card 1 of 10</span>
      <button class="fc-close" onclick="closeFlashcards()">&#x2715;</button>
    </div>
    <div class="fc-pbar"><div class="fc-pbar-fill" id="fcPbarFill" style="width:10%"></div></div>
    <div class="fc-module-title" id="fcModTitle"></div>
    <div class="fc-card-wrap" onclick="flipCard()">
      <div class="fc-card" id="fcCard">
        <div class="fc-face fc-front" id="fcFront"></div>
        <div class="fc-face fc-back" id="fcBack"></div>
      </div>
    </div>
    <div class="fc-tap-hint">Tap card to flip</div>
    <div class="fc-nav">
      <button class="fc-nav-btn" id="fcPrevBtn" onclick="prevFcCard()" disabled>&#x2190; Prev</button>
      <button class="fc-done-btn" onclick="closeFlashcards()">Done</button>
      <button class="fc-nav-btn" id="fcNextBtn" onclick="nextFcCard()">Next &#x2192;</button>
    </div>
  </div>
</div>

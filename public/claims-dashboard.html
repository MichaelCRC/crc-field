<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- CRC PWA HEAD -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1B2360">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CRC Field">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<title>CRC Claims Leaderboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0f1a; color: #e0e6f0; min-height: 100vh; }
  .header { background: linear-gradient(135deg, #1B2360 0%, #002870 100%); padding: 24px; text-align: center; border-bottom: 3px solid #00BCD4; }
  .header h1 { font-size: 28px; font-weight: 700; color: #fff; letter-spacing: 1px; }
  .header h1 span { color: #00BCD4; }
  .header .subtitle { color: #8899bb; font-size: 14px; margin-top: 4px; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; padding: 16px; max-width: 1200px; margin: 0 auto; }
  .stat-card { background: #111827; border: 1px solid #1e293b; border-radius: 12px; padding: 16px; text-align: center; }
  .stat-card .value { font-size: 32px; font-weight: 800; color: #00BCD4; }
  .stat-card .label { font-size: 12px; color: #8899bb; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
  .section { max-width: 1200px; margin: 0 auto; padding: 0 16px 16px; }
  .section h2 { font-size: 18px; color: #00BCD4; margin: 20px 0 12px; padding-left: 8px; border-left: 3px solid #00BCD4; }
  .leaderboard { width: 100%; border-collapse: collapse; }
  .leaderboard th { background: #1B2360; color: #00BCD4; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; padding: 10px 12px; text-align: left; position: sticky; top: 0; }
  .leaderboard td { padding: 10px 12px; border-bottom: 1px solid #1e293b; font-size: 14px; }
  .leaderboard tr:hover { background: #111827; }
  .leaderboard .rank { font-weight: 800; color: #00BCD4; width: 40px; text-align: center; }
  .leaderboard .rep-name { font-weight: 600; color: #fff; }
  .leaderboard .rep-name a { color: #00BCD4; text-decoration: none; transition: opacity 0.2s; }
  .leaderboard .rep-name a:hover { opacity: 0.8; text-decoration: underline; }
  .leaderboard .rep-name a::after { content: ' \2197'; font-size: 10px; opacity: 0.5; }
  .leaderboard .num { text-align: right; font-variant-numeric: tabular-nums; }
  .leaderboard .money { color: #4ade80; }
  tr.gold td { background: rgba(255, 215, 0, 0.05); }
  tr.silver td { background: rgba(192, 192, 192, 0.03); }
  tr.bronze td { background: rgba(205, 127, 50, 0.03); }
  .rank-badge { display: inline-block; width: 26px; height: 26px; border-radius: 50%; line-height: 26px; text-align: center; font-weight: 800; font-size: 13px; }
  .gold .rank-badge { background: #ffd700; color: #1B2360; }
  .silver .rank-badge { background: #c0c0c0; color: #1B2360; }
  .bronze .rank-badge { background: #cd7f32; color: #fff; }
  .pipeline-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
  .pipeline-item { background: #111827; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
  .pipeline-item .status { font-size: 13px; color: #cdd6e4; }
  .pipeline-item .count { font-size: 20px; font-weight: 700; color: #00BCD4; }
  .monthly-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
  .month-card { background: #111827; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; text-align: center; }
  .month-card .month-name { font-size: 12px; color: #8899bb; text-transform: uppercase; }
  .month-card .month-count { font-size: 24px; font-weight: 700; color: #fff; margin: 4px 0; }
  .month-card .month-value { font-size: 13px; color: #4ade80; }
  .loading { text-align: center; padding: 60px; color: #8899bb; font-size: 18px; }
  .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid #1e293b; }
  @media (max-width: 640px) {
    .stat-card .value { font-size: 24px; }
    .leaderboard { font-size: 12px; }
    .leaderboard th, .leaderboard td { padding: 8px 6px; }
  }
</style>
</head>
<body>
<div class="header">
  <h1>CRC <span>Claims Leaderboard</span></h1>
  <div class="subtitle" id="generated">Loading...</div>
</div>
<div class="stats-grid" id="totals"></div>
<div class="section">
  <h2>Rep Leaderboard</h2>
  <div class="table-wrap">
    <table class="leaderboard" id="leaderboard">
      <thead>
        <tr>
          <th>#</th>
          <th>Rep</th>
          <th class="num">Jobs</th>
          <th class="num">Claims</th>
          <th class="num">Inspections</th>
          <th class="num">Approved</th>
          <th class="num">Pending</th>
          <th class="num">Value</th>
          <th class="num">MTD</th>
          <th class="num">Weekly</th>
        </tr>
      </thead>
      <tbody id="lb-body"></tbody>
    </table>
  </div>
</div>
<div class="section">
  <h2>Pipeline</h2>
  <div class="pipeline-grid" id="pipeline"></div>
</div>
<div class="section">
  <h2>Monthly Breakdown</h2>
  <div class="monthly-grid" id="monthly"></div>
</div>
<div class="section">
  <h2>Last 7 Days</h2>
  <div class="stats-grid" id="weekly"></div>
</div>
<script>
// v3.1 Bug #6 softening (2026-06-01): JN snapshot only carries
// amount_to_be_paid for ~5% of jobs. Show em-dash for $0 rows so
// the leaderboard doesn't lie about zero revenue. Total Value card
// at the top rolls up across all jobs and stays as $X formatting.
const fmt = n => (n > 0) ? '$' + n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 }) : '—';

let repCodeMap = {};

async function loadRepCodes() {
  try {
    const res = await fetch('/api/rep-codes');
    const codes = await res.json();
    codes.forEach(c => { repCodeMap[c.name] = c.code; });
  } catch(e) {}
}

async function load() {
  try {
    await loadRepCodes();
    const res = await fetch('/api/claims-dashboard');
    const d = await res.json();
    render(d);
  } catch (e) {
    document.getElementById('generated').textContent = 'Error loading data: ' + e.message;
  }
}

function render(d) {
  const t = d.company_totals;
  document.getElementById('generated').textContent = 'Updated: ' + new Date(d.generated_at).toLocaleString();

  document.getElementById('totals').innerHTML = [
    card(t.total_jobs, 'Total Jobs'),
    card(t.total_claims, 'Claims Filed'),
    card(t.total_approved, 'Approved'),
    card(t.total_pending, 'Pending'),
    card(t.total_active, 'Active Pipeline'),
    card(fmt(t.total_value), 'Total Value'),
  ].join('');

  const medals = ['gold', 'silver', 'bronze'];
  document.getElementById('lb-body').innerHTML = d.by_rep.map((r, i) => {
    const cls = i < 3 ? medals[i] : '';
    const badge = i < 3 ? '<span class="rank-badge">' + (i + 1) + '</span>' : (i + 1);
    return '<tr class="' + cls + '">' +
      '<td class="rank">' + badge + '</td>' +
      '<td class="rep-name">' + (repCodeMap[r.rep_name] ? '<a href="/rep-card/' + repCodeMap[r.rep_name] + '">' + r.rep_name + '</a>' : r.rep_name) + '</td>' +
      '<td class="num">' + r.total_jobs + '</td>' +
      '<td class="num">' + r.claims_filed + '</td>' +
      '<td class="num">' + r.inspections + '</td>' +
      '<td class="num">' + r.approved + '</td>' +
      '<td class="num">' + r.pending + '</td>' +
      '<td class="num money">' + fmt(r.total_value) + '</td>' +
      '<td class="num">' + r.mtd + '</td>' +
      '<td class="num">' + r.weekly + '</td>' +
      '</tr>';
  }).join('');

  const sorted = Object.entries(d.pipeline).sort((a, b) => b[1] - a[1]);
  document.getElementById('pipeline').innerHTML = sorted.map(([s, c]) =>
    '<div class="pipeline-item"><span class="status">' + s + '</span><span class="count">' + c + '</span></div>'
  ).join('');

  const monthNames = { jan: 'Jan', feb: 'Feb', mar: 'Mar', apr: 'Apr', may: 'May', jun: 'Jun', jul: 'Jul', aug: 'Aug', sep: 'Sep', oct: 'Oct', nov: 'Nov', dec: 'Dec' };
  const activeMonths = Object.entries(d.monthly).filter(([_, v]) => v.count > 0);
  document.getElementById('monthly').innerHTML = activeMonths.map(([m, v]) =>
    '<div class="month-card"><div class="month-name">' + monthNames[m] + '</div><div class="month-count">' + v.count + '</div><div class="month-value">' + fmt(v.value) + '</div></div>'
  ).join('');

  const w = d.weekly;
  document.getElementById('weekly').innerHTML = [
    card(w.count, 'New Jobs'),
    card(w.claims_filed, 'Claims Filed'),
    card(w.approved, 'Approved'),
    card(fmt(w.value), 'Value'),
  ].join('');
}

function card(val, label) {
  return '<div class="stat-card"><div class="value">' + val + '</div><div class="label">' + label + '</div></div>';
}

load();
setInterval(load, 300000);
</script>
  <!-- CRC PWA SW -->
  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{});});}</script>
</body>
</html>
